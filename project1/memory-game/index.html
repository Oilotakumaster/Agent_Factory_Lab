<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶翻牌遊戲 - Memory Match</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>記憶翻牌遊戲</h1>
            <div class="stats">
                <p>步數: <span id="moves">0</span></p>
                <p>配對: <span id="matches">0</span> / 8</p>
            </div>
            <button id="restart-btn" class="btn">重新開始</button>
        </header>

        <main class="grid-container" id="grid">
            <!-- Cards will be generated by JS -->
        </main>

        <div class="victory-modal" id="victory-modal">
            <div class="modal-content">
                <h2>恭喜過關！🎉</h2>
                <p>你總共花了 <span id="final-moves">0</span> 步完成！</p>
                <button id="play-again-btn" class="btn">再玩一次</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
