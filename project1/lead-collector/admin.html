<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名單管理後台 - Lead Collector</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-container">
        <header class="admin-header">
            <h1>潛在客戶名單管理 (Admin)</h1>
            <div class="admin-actions">
                <button id="export-csv-btn" class="export-btn">匯出為 CSV (Excel)</button>
                <button id="clear-data-btn" class="danger-btn">清空所有資料</button>
                <a href="index.html" class="back-link">← 返回活動前台</a>
            </div>
        </header>

        <div class="stats-cards">
            <div class="stat-card">
                <h3>已成功蒐集總數</h3>
                <p id="total-leads">0</p>
            </div>
        </div>

        <div class="table-container">
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>收集時間</th>
                        <th>稱呼 (Name)</th>
                        <th>電子郵件 (Email)</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Data will be populated here by JS -->
                </tbody>
            </table>
            <div id="no-data" class="no-data hidden">目前還沒有收到任何名單。</div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
