<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獨家 AI 提示詞大補帖 - 免費領取</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="landing-container">
        <div class="hero">
            <div class="hero-content">
                <span class="badge">限時免費領取</span>
                <h1>掌握未來的生產力：<br><span class="highlight">100+ 實用 AI 提示詞大全</span></h1>
                <p>這份獨家指南將教你如何使用最強大的 AI 模型，讓你的工作效率提升十倍。只需填寫 Email，我們將立即把 PDF 寄給你！</p>
                
                <form id="lead-form" class="lead-form">
                    <div class="input-group">
                        <input type="text" id="name" placeholder="您的稱呼 (選填)" autocomplete="name">
                    </div>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="您的最佳 Email 地址" required autocomplete="email">
                    </div>
                    <button type="submit" class="submit-btn" id="submit-btn">立即獲取指南 🚀</button>
                    <p class="privacy-note">我們保證不會發送垃圾郵件，您可以隨時取消訂閱。</p>
                </form>

                <div id="success-message" class="success-message hidden">
                    <h3>🎉 恭喜！申請成功！</h3>
                    <p>感謝您的訂閱！我們已經（模擬）將指南發送到您的信箱囉。</p>
                </div>
            </div>
            
            <div class="hero-image">
                <div class="ebook-mockup">
                    <div class="mockup-text">AI Prompts Guide 2026</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="admin-footer">
        <a href="admin.html" class="admin-link">進入管理者後台 (觀看蒐集的資料)</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
