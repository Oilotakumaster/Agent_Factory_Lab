<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Nexus Auth</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-layout">
    <div class="split-screen">
        <div class="left-pane login-bg">
            <div class="brand">
                <i class="fa-solid fa-bolt"></i> Nexus Auth
            </div>
            <div class="hero-text">
                <h2>歡迎回來。</h2>
                <p>登入以繼續探索無限可能，體驗下一代的操作介面與強大安全機制。</p>
            </div>
        </div>
        <div class="right-pane">
            <div class="form-container">
                <div class="mobile-brand">
                    <i class="fa-solid fa-bolt"></i> Nexus Auth
                </div>
                <h2>登入帳號</h2>
                <p class="subtitle">還沒有帳號嗎？ <a href="register.html">立即免費註冊</a></p>
                
                <form id="login-form">
                    <div class="input-group">
                        <label for="email">電子郵件 / Email</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">密碼 / Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="輸入您的密碼" required>
                            <button type="button" class="toggle-pwd"><i class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            記住我
                        </label>
                        <a href="#" class="forgot-link">忘記密碼？</a>
                    </div>
                    
                    <div id="auth-error" class="error-msg hidden">帳號或密碼錯誤。</div>
                    
                    <button type="submit" class="submit-btn" id="login-btn">
                        <span>登入</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
        // Redirect to dashboard if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('nexus_session'));
            if (session && session.isLoggedIn) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
